[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cody-ai-shared-lib"
version = "0.8.0"
description = "Shared utilities for Cody AI projects: Gemini embeddings, Jina article fetcher, model-agnostic LLM client, Jev (TypeSafe System One) client, URL safety validator, Supabase client, JWT authentication, Resend email delivery, and Edge-TTS synthesis"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "google-genai>=1.0.0",
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    # PDF text for reading aloud (pdf_text module, used by AudioReading): pure Python, small memory.
    "pdfminer.six>=20260107",
    "typesafe-sdk>=0.7.0",
    "pyjwt[crypto]>=2.8.0",
    "edge-tts>=7.0.0,<8.0.0",
    "resend>=2.0.0",
]

[project.optional-dependencies]
# Only the tests build fixture PDFs with pymupdf; the library itself reads PDFs with pdfminer.six.
test = ["pymupdf>=2.0,<2.1"]

[tool.setuptools.packages.find]
include = ["cody_ai_shared_lib*"]

[tool.setuptools.package-data]
"cody_ai_shared_lib.rag" = ["sql/*.sql"]
